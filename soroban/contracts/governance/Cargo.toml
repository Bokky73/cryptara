[package]
name = "cryptara-governance"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"
publish = false

[dependencies]
soroban-sdk = { workspace = true }
cryptara-policy = { path = "../policy", optional = true }
cryptara-risk-registry = { path = "../risk-registry", optional = true }
cryptara-audit-registry = { path = "../audit-registry", optional = true }

[features]
default = []
policy = ["cryptara-policy"]
risk-registry = ["cryptara-risk-registry"]
audit-registry = ["cryptara-audit-registry"]
testutils = []

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true