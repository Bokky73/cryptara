name: Feature · fee analysis

on:
  pull_request:
    paths:
      - "frontend/src/server/research/fee-analysis/**"
      - "frontend/src/components/research/fee-analysis/**"
      - "frontend/src/app/insights/fee-analysis/**"
      - "frontend/src/app/api/insights/fee-analysis/**"
      - "frontend/tests/features/fee-analysis/**"
      - ".github/workflows/feature-fee-analysis.yml"
  push:
    branches: [main]

concurrency:
  group: feature-fee-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  focused-suite:
    name: fee-analysis focused suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused suite
        working-directory: frontend
        run: npx vitest run tests/features/fee-analysis
