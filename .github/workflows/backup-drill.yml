name: Backup Drill

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
      - name: Create databases
        run: |
          psql -c "CREATE DATABASE source;"
          psql -c "CREATE DATABASE target;"
      - name: Seed source database
        run: |
          psql -d source -f frontend/src/server/storage/schema.sql
          psql -d source -f scripts/backup/seed-fixture.sql
      - name: Run backup drill
        env:
          SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/source
          TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/target
        run: node scripts/backup/drill.mjs --source-url "$SOURCE_DATABASE_URL" --target-url "$TARGET_DATABASE_URL"
      - name: Upload drill summary report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backup-drill-summary
          path: backups/drill-summary.json
          if-no-files-found: warn
