name: Proxy inspector feature
on:
  pull_request:
    paths: ["frontend/src/server/research/proxy-inspector/**", "frontend/src/components/research/proxy-inspector/**", "frontend/tests/features/proxy-inspector/**"]
permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/proxy-inspector
      - run: npx eslint src/server/research/proxy-inspector src/components/research/proxy-inspector tests/features/proxy-inspector
