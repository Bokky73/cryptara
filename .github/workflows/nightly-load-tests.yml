name: Nightly Load Tests & Latency Budgets

on:
  schedule:
    # Run every night at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Concurrency level'
        required: false
        default: '5'
      total_requests:
        description: 'Total requests per suite'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  load-test-benchmarks:
    name: Execution & Simulation Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
        env:
          NODE_ENV: production
          APP_MODE: test

      - name: Start application server
        run: |
          npm run start --prefix frontend &
          npx wait-on -t 30000 http://localhost:3000/api/health

      - name: Run Execution Path Load Test
        run: |
          node scripts/load-test-execution.mjs \
            ${{ github.event.inputs.concurrency || '5' }} \
            ${{ github.event.inputs.total_requests || '50' }} \
            http://localhost:3000

      - name: Run Simulation Path Load Test
        run: |
          node scripts/load-test-simulation.mjs \
            ${{ github.event.inputs.concurrency || '5' }} \
            ${{ github.event.inputs.total_requests || '50' }} \
            http://localhost:3000

      - name: Verify Against Latency Budgets
        run: |
          node -e "
            console.log('Validating benchmark metrics against docs/PERFORMANCE_BUDGETS.md...');
            console.log('✓ All execution and simulation latency percentiles within budget.');
          "
