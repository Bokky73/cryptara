name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  STELLAR_CLI_VERSION: "26.1.0"

permissions:
  contents: read

jobs:
  agent-replay:
    name: Deterministic agent replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run test:agent-replay
      - run: npm run test:authz-coverage

  app-quality:
    name: App quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run quality gate
        run: npm run quality:gate

  evm-contracts:
    name: EVM CryptaraVault
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/contracts/package-lock.json

      - name: Install contract dependencies
        run: npm ci

      - name: Compile CryptaraVault
        run: npm run compile

      - name: Test CryptaraVault
        run: npm test

  soroban:
    name: Soroban workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: soroban -> target
          cache-targets: false
          cache-on-failure: true

      - name: Cache Stellar CLI
        id: cache-stellar-cli
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version ${{ env.STELLAR_CLI_VERSION }}

      - name: Format check
        run: cargo fmt --manifest-path soroban/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path soroban/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --manifest-path soroban/Cargo.toml

      - name: Reproducible WASM build
        run: stellar contract build --manifest-path soroban/Cargo.toml

  api-smoke:
    name: API smoke
    runs-on: ubuntu-latest
    env:
      APP_MODE: test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      GOAT_RPC_URL: https://rpc.goat.network
      NEXT_PUBLIC_GOAT_RPC_URL: https://rpc.goat.network
      X402_PAY_TO: "0x000000000000000000000000000000000000dEaD"
      X402_PRICE_USD: "$0.01"
      X402_NETWORK: "eip155:84532"
      X402_FACILITATOR_URL: https://x402.org/facilitator
      X402_ASSET: USDC
      SMOKE_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build production app
        run: npm run build

      - name: Bootstrap environment
        run: npm run bootstrap

      - name: Seed environment
        run: npm run seed

      - name: Start server and run smoke checks
        run: |
          set -euo pipefail
          npm run start &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -sf "$SMOKE_BASE_URL/api/health" >/dev/null; then
              npm run smoke
              exit 0
            fi
            sleep 2
          done

          echo "Server did not become healthy in time" >&2
          exit 1

  e2e-journey:
    name: E2E journey tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
      APP_MODE: test
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: cryptara-demo
      NEXT_PUBLIC_STELLAR_NETWORK: stellar-testnet
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Run E2E journey suite
        run: npm run test:e2e -- --project=chromium-desktop
        working-directory: frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn

  db-migrations:
    name: DB migrations & schema drift
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(toJSON(github.event.pull_request.files.*.filename), 'db/') ||
      contains(toJSON(github.event.pull_request.files.*.filename), 'frontend/src/server/storage/') ||
      contains(toJSON(github.event.pull_request.files.*.filename), 'scripts/')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cryptara
          POSTGRES_PASSWORD: cryptara
          POSTGRES_DB: cryptara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptara"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cryptara:cryptara@localhost:5432/cryptara_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Forward migrations
        run: node scripts/migrate.mjs

      - name: Validation SQL assertions
        run: |
          psql "$DATABASE_URL" <<'SQL'
            -- migration_history table must exist and have at least one row
            DO $$
            BEGIN
              IF (SELECT COUNT(*) FROM migration_history) = 0 THEN
                RAISE EXCEPTION 'No migrations recorded in migration_history';
              END IF;
            END;
            $$;
          SQL

      - name: Schema drift check
        run: node scripts/schema-drift-check.mjs

      - name: Rollback and re-apply idempotency check
        run: |
          set -euo pipefail
          MIGRATIONS_DIR="db/migrations"
          # Apply all down migrations in reverse order
          for f in $(ls "$MIGRATIONS_DIR"/*.down.sql | sort -r); do
            echo "Rolling back: $f"
            psql "$DATABASE_URL" -f "$f"
          done
          # Re-apply forward migrations
          node scripts/migrate.mjs
          echo "Rollback and re-apply cycle passed."

  artifact-provenance:
    name: Contract artifact provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/contracts/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: soroban -> target
          cache-targets: false
          cache-on-failure: true

      - name: Cache Stellar CLI
        id: cache-stellar-cli-provenance
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-${{ runner.os }}-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.cache-stellar-cli-provenance.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version ${{ env.STELLAR_CLI_VERSION }}

      - name: Install root dependencies
        run: npm ci

      - name: Install EVM contract dependencies
        run: npm ci
        working-directory: backend/contracts

      - name: Verifier self-test
        run: node scripts/verify-artifact-provenance.mjs --self-test

      - name: Dual clean EVM builds
        working-directory: backend/contracts
        run: |
          set -euo pipefail
          hash_creation() {
            node -e '
              const fs = require("fs");
              const crypto = require("crypto");
              const art = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const hex = String(art.bytecode || "").replace(/^0x/, "");
              process.stdout.write(crypto.createHash("sha256").update(Buffer.from(hex, "hex")).digest("hex"));
            ' "$1"
          }
          npx hardhat clean && npx hardhat compile
          H1="$(hash_creation artifacts/contracts/CryptaraPolicy.sol/CryptaraPolicy.json)"
          npx hardhat clean && npx hardhat compile
          H2="$(hash_creation artifacts/contracts/CryptaraPolicy.sol/CryptaraPolicy.json)"
          echo "EVM creation bytecode pass1=${H1}"
          echo "EVM creation bytecode pass2=${H2}"
          test "$H1" = "$H2"

      - name: Dual clean Soroban builds
        run: |
          set -euo pipefail
          WASM=soroban/target/wasm32v1-none/release/cryptara_policy.wasm
          stellar contract build --manifest-path soroban/Cargo.toml
          H1="$(sha256sum "$WASM" | awk '{print $1}')"
          rm -rf soroban/target/wasm32v1-none/release
          stellar contract build --manifest-path soroban/Cargo.toml
          H2="$(sha256sum "$WASM" | awk '{print $1}')"
          echo "Soroban WASM pass1=${H1}"
          echo "Soroban WASM pass2=${H2}"
          test "$H1" = "$H2"

      - name: Freeze release provenance manifest
        run: node scripts/hash-freeze-build.mjs --write --release

      - name: Verify provenance manifest
        run: node scripts/verify-artifact-provenance.mjs --strict release-manifests/latest.json

      - name: Upload provenance manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-artifact-provenance
          path: release-manifests/
          if-no-files-found: error

  read-client:
    name: Read client package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/read-client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix packages/read-client

      - name: Typecheck and build
        run: npm run build --prefix packages/read-client

      - name: Test read-client
        run: npm test --prefix packages/read-client

