name: Alert rule lab feature
on:
  pull_request:
    paths: ["frontend/src/server/research/alert-rule-lab/**", "frontend/src/components/research/alert-rule-lab/**", "frontend/tests/features/alert-rule-lab/**"]
permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx vitest run tests/features/alert-rule-lab
      - run: npx eslint src/server/research/alert-rule-lab src/components/research/alert-rule-lab tests/features/alert-rule-lab
