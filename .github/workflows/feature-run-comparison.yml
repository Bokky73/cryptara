name: Feature · run comparison

on:
  pull_request:
    paths:
      - "frontend/src/server/research/run-comparison/**"
      - "frontend/src/components/research/run-comparison/**"
      - "frontend/src/app/insights/run-comparison/**"
      - "frontend/src/app/api/insights/run-comparison/**"
      - "frontend/tests/features/run-comparison/**"
      - ".github/workflows/feature-run-comparison.yml"
  push:
    branches: [main]

concurrency:
  group: feature-run-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  focused-suite:
    name: run-comparison focused suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused suite
        working-directory: frontend
        run: npx vitest run tests/features/run-comparison
