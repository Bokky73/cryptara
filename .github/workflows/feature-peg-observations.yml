name: Feature · peg observations

on:
  pull_request:
    paths:
      - "frontend/src/server/research/peg-observations/**"
      - "frontend/src/components/research/peg-observations/**"
      - "frontend/src/app/insights/peg-observations/**"
      - "frontend/src/app/api/insights/peg-observations/**"
      - "frontend/tests/features/peg-observations/**"
      - ".github/workflows/feature-peg-observations.yml"
  push:
    branches: [main]

concurrency:
  group: feature-peg-observations-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  focused-suite:
    name: peg-observations focused suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run focused suite
        working-directory: frontend
        run: npx vitest run tests/features/peg-observations
