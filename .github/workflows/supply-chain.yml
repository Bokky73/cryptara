name: Supply chain

on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "soroban/Cargo.toml"
      - "soroban/Cargo.lock"
      - "scripts/build-*.sh"
      - "scripts/*sbom*"
      - "scripts/*provenance*"
      - "scripts/*dependency-policy*"
      - ".github/workflows/supply-chain.yml"
      - ".github/dependabot.yml"
      - "docs/SUPPLY_CHAIN.md"
      - "docs/security/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  inventory-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/contracts/package-lock.json
            packages/read-client/package-lock.json
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix frontend
      - run: npm ci --ignore-scripts --prefix backend/contracts
      - run: npm ci --ignore-scripts --prefix packages/read-client
      - run: npm run supply-chain:policy:audit
      - run: npm run sbom:generate
      - name: Prove lockfiles were not rewritten
        run: git diff --exit-code -- package-lock.json frontend/package-lock.json backend/contracts/package-lock.json packages/read-client/package-lock.json soroban/Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sboms
          path: artifacts/sbom/*.json
          if-no-files-found: error

  build-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/contracts/package-lock.json
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          targets: wasm32v1-none
      - run: npm ci --ignore-scripts --prefix backend/contracts
      - run: ./scripts/build-evm.sh
      - run: ./scripts/build-soroban.sh
      - run: npm run provenance:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-build-provenance
          path: artifacts/provenance/*.json
          if-no-files-found: error
