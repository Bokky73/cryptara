version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      root-runtime:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-runtime:
        patterns: ["*"]
        exclude-patterns: ["@types/*", "eslint*", "prettier*"]
      frontend-tooling:
        patterns: ["@types/*", "eslint*", "prettier*", "playwright*"]

  - package-ecosystem: "npm"
    directory: "/backend/contracts"
    schedule:
      interval: "weekly"
    groups:
      evm-tooling:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/packages/read-client"
    schedule:
      interval: "weekly"
      evm-runtime: { dependency-type: production }
      evm-tooling: { dependency-type: development }
  - package-ecosystem: npm
    directory: /packages/read-client
    schedule: { interval: weekly }
    groups:
      read-client-tooling: { dependency-type: development }
  - package-ecosystem: cargo
    directory: /soroban
    schedule: { interval: weekly }
    groups:
      client-tooling:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/soroban"
    schedule:
      interval: "weekly"
    groups:
      soroban-locked:
        patterns: ["soroban-sdk"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
